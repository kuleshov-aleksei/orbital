name: Publish Electron Release

# Runs when a draft Electron release is published. Promotes the staged update
# manifests on the Garage (S3) bucket root, which makes the update instantly
# available to clients

permissions:
  contents: read

on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: [self-hosted, linux, x64]

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
      AWS_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      AWS_CLI_VERSION: ${{ vars.AWS_CLI_VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Promote update manifests to S3
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"

          docker run --rm \
            -v "$PWD/scripts/aws-cli-config:/aws/config:ro" -e AWS_CONFIG_FILE=/aws/config \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION -e AWS_ENDPOINT_URL \
            amazon/aws-cli:${AWS_CLI_VERSION} s3 cp "s3://${S3_BUCKET}/_staging/${VERSION}/latest.yml" "s3://${S3_BUCKET}/latest.yml"
          docker run --rm \
            -v "$PWD/scripts/aws-cli-config:/aws/config:ro" -e AWS_CONFIG_FILE=/aws/config \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION -e AWS_ENDPOINT_URL \
            amazon/aws-cli:${AWS_CLI_VERSION} s3 cp "s3://${S3_BUCKET}/_staging/${VERSION}/latest-linux.yml" "s3://${S3_BUCKET}/latest-linux.yml"

          # Over-the-air frontend manifests (docs/notes/MIGRATION_TO_S3.md "OTA frontend").
          # Builds staged before OTA existed have none: skip them quietly.
          for f in ota-electron.json ota-android.json; do
            docker run --rm \
              -v "$PWD/scripts/aws-cli-config:/aws/config:ro" -e AWS_CONFIG_FILE=/aws/config \
              -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION -e AWS_ENDPOINT_URL \
              amazon/aws-cli:${AWS_CLI_VERSION} s3 cp "s3://${S3_BUCKET}/_staging/${VERSION}/$f" "s3://${S3_BUCKET}/$f" \
              --content-type application/json --cache-control no-cache \
              || echo "No staged $f for ${VERSION}, skipping"
          done

          echo "Promoted ${VERSION} manifests to s3://${S3_BUCKET}/ (update is live)"

