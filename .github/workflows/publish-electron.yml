name: Publish Electron Release

# Runs when a draft Electron release is published. Scans the installer with
# VirusTotal (informational) and promotes the staged update manifests on the
# Garage (S3) bucket root, which makes the update instantly available to clients.

permissions:
  contents: read

on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: [self-hosted, linux, x64]
    permissions:
      # required to write GitHub Release body
      contents: write

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
      AWS_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: VirusTotal Scan
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          update_release_body: true
          files: |
            .exe$

      - name: Promote update manifests to S3
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"

          docker run --rm \
            -v "$PWD/scripts/aws-cli-config:/aws/config:ro" -e AWS_CONFIG_FILE=/aws/config \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION -e AWS_ENDPOINT_URL \
            amazon/aws-cli s3 cp "s3://${S3_BUCKET}/_staging/${VERSION}/latest.yml" "s3://${S3_BUCKET}/latest.yml"
          docker run --rm \
            -v "$PWD/scripts/aws-cli-config:/aws/config:ro" -e AWS_CONFIG_FILE=/aws/config \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION -e AWS_ENDPOINT_URL \
            amazon/aws-cli s3 cp "s3://${S3_BUCKET}/_staging/${VERSION}/latest-linux.yml" "s3://${S3_BUCKET}/latest-linux.yml"

          echo "Promoted ${VERSION} manifests to s3://${S3_BUCKET}/ (update is live)"
