name: Build Electron App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, linux, x64]

    env:
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 10
          fetch-tags: true
      
      - name: Fetch tags
        run: |
          export HOME=/opt/actions-runner/_work/
          git config --global --add safe.directory /opt/actions-runner/_work/orbital/orbital
          git fetch --prune --unshallow --tags

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.1.0

      - name: Extract version
        id: get_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Validate version
        run: |
          if [ "$VERSION" = "0.0.0-unknown" ]; then
            echo "ERROR: Failed to extract version. Aborting deployment."
            exit 1
          fi

      - name: Build Electron in Docker
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build \
            --build-arg VERSION=${{ env.VERSION }} \
            --build-arg VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }} \
            --build-arg UPDATE_URL=${{ secrets.UPDATE_URL }} \
            -t orbital-electron-build \
            -f docker/Dockerfile.electron .

      - name: Copy artifacts
        run: |
          docker create --name orbital-extract orbital-electron-build
          docker cp orbital-extract:/app/electron/release ./electron
          docker rm orbital-extract

      - name: Configure S3 (Garage) credentials
        if: github.ref_type == 'tag'
        run: |
          SCHEME="${S3_ENDPOINT%%://*}"
          HOST="${S3_ENDPOINT#*://}"
          echo "MC_HOST_garage=${SCHEME}://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@${HOST}" >> "$GITHUB_ENV"

      - name: Upload binaries to S3
        if: github.ref_type == 'tag'
        run: |
          docker run --rm -v "$PWD/electron/release:/data" -e MC_HOST_garage \
            minio/mc cp \
              "/data/Orbital-Setup-${VERSION}.exe" \
              "/data/Orbital-Setup-${VERSION}.exe.blockmap" \
              "/data/Orbital-${VERSION}.AppImage" \
              "garage/${S3_BUCKET}/"

      - name: Stage update manifests on S3
        if: github.ref_type == 'tag'
        run: |
          docker run --rm -v "$PWD/electron/release:/data" -e MC_HOST_garage \
            minio/mc cp /data/latest.yml /data/latest-linux.yml "garage/${S3_BUCKET}/_staging/${VERSION}/"

      - name: Prune old S3 releases (keep 3)
        if: github.ref_type == 'tag'
        run: ./scripts/prune-s3-releases.sh "${S3_BUCKET}" 3

      - name: Upload Release Assets
        if: github.ref_type == 'tag'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: "electron/release/*Setup*.exe,electron/release/*.blockmap,electron/release/latest.yml,electron/release/*.AppImage,electron/release/latest-linux.yml"
          token: ${{ secrets.UAT_TOKEN }}
          commit: ${{ github.sha }}
          tag: ${{ env.VERSION }}
          name: Desktop v${{ env.VERSION }}
          body: "Automated build"
          draft: true
          
      - name: Remove old builder images (keep build cache)
        run: docker image rm orbital-electron-build || true
