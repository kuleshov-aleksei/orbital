name: Build Desktop & Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, linux, x64]

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
      AWS_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      AWS_CLI_VERSION: ${{ vars.AWS_CLI_VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 10
          fetch-tags: true
      
      - name: Fetch tags
        run: |
          export HOME=/opt/actions-runner/_work/
          git config --global --add safe.directory /opt/actions-runner/_work/orbital/orbital
          git fetch --prune --unshallow --tags

      - name: Extract version
        id: get_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"
          # Android versionCode must increase with every release
          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            VERSION_CODE=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          else
            VERSION_CODE=${{ github.run_number }}
          fi
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Android versionCode: $VERSION_CODE"

      - name: Validate version
        run: |
          if [ "$VERSION" = "0.0.0-unknown" ]; then
            echo "ERROR: Failed to extract version. Aborting deployment."
            exit 1
          fi

      - name: Build Electron in Docker
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build \
            --build-arg VERSION=${{ env.VERSION }} \
            --build-arg VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }} \
            --build-arg UPDATE_URL=${{ secrets.UPDATE_URL }} \
            -t orbital-electron-build \
            -f docker/Dockerfile.electron .

      - name: Copy artifacts
        run: |
          docker create --name orbital-extract orbital-electron-build
          docker cp orbital-extract:/app/electron/release ./electron
          docker rm orbital-extract

      - name: Prepare Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/orbital-release.jks"
          test -s "$RUNNER_TEMP/orbital-release.jks"

      - name: Prepare Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
          test -s "$RUNNER_TEMP/google-services.json"

      - name: Build Android in Docker
        env:
          DOCKER_BUILDKIT: 1
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          docker build \
            --secret id=android_keystore,src="$RUNNER_TEMP/orbital-release.jks" \
            --secret id=android_keystore_password,env=ANDROID_KEYSTORE_PASSWORD \
            --secret id=android_key_alias,env=ANDROID_KEY_ALIAS \
            --secret id=google_services,src="$RUNNER_TEMP/google-services.json" \
            --build-arg VERSION=${{ env.VERSION }} \
            --build-arg VERSION_CODE=${{ env.VERSION_CODE }} \
            --build-arg VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }} \
            -t orbital-android-build \
            -f docker/Dockerfile.android .

      - name: Copy APK
        run: |
          docker create --name orbital-android-extract orbital-android-build
          docker cp "orbital-android-extract:/app/release/Orbital-${VERSION}.apk" ./electron/release/
          docker rm orbital-android-extract

      - name: Upload binaries to S3
        if: github.ref_type == 'tag'
        run: |
          for f in \
            "Orbital-Setup-${VERSION}.exe" \
            "Orbital-Setup-${VERSION}.exe.blockmap" \
            "Orbital-${VERSION}.AppImage" \
            "Orbital-${VERSION}.apk"; do
            # aws-cli guesses the type from the extension and knows neither .apk nor
            # .AppImage; without a type (and with nosniff) mobile Chrome renders the file
            # as text. Set it explicitly and force a download.
            case "$f" in
              *.apk) type="application/vnd.android.package-archive" ;;
              *) type="application/octet-stream" ;;
            esac
            docker run --rm -v "$PWD/electron/release:/data" \
              -v "$PWD/scripts/aws-cli-config:/aws/config:ro" -e AWS_CONFIG_FILE=/aws/config \
              -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION -e AWS_ENDPOINT_URL \
              amazon/aws-cli:${AWS_CLI_VERSION} s3 cp "/data/$f" "s3://${S3_BUCKET}/" \
              --content-type "$type" --content-disposition "attachment; filename=\"$f\""
          done

      - name: Stage update manifests on S3
        if: github.ref_type == 'tag'
        run: |
          for f in latest.yml latest-linux.yml; do
            docker run --rm -v "$PWD/electron/release:/data" \
              -v "$PWD/scripts/aws-cli-config:/aws/config:ro" -e AWS_CONFIG_FILE=/aws/config \
              -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION -e AWS_ENDPOINT_URL \
              amazon/aws-cli:${AWS_CLI_VERSION} s3 cp "/data/$f" "s3://${S3_BUCKET}/_staging/${VERSION}/$f"
          done

      - name: Prune old S3 releases (keep 3)
        if: github.ref_type == 'tag'
        run: ./scripts/prune-s3-releases.sh "${S3_BUCKET}" 3

      - name: Upload Release Assets
        if: github.ref_type == 'tag'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: "electron/release/*Setup*.exe,electron/release/*.blockmap,electron/release/latest.yml,electron/release/*.AppImage,electron/release/latest-linux.yml,electron/release/*.apk"
          token: ${{ secrets.UAT_TOKEN }}
          commit: ${{ github.sha }}
          tag: ${{ env.VERSION }}
          name: Desktop v${{ env.VERSION }}
          body: "Automated build"
          draft: true
          
      - name: Remove Android signing and Firebase files
        if: always()
        run: rm -f "$RUNNER_TEMP/orbital-release.jks" "$RUNNER_TEMP/google-services.json"

      - name: Remove old builder images (keep build cache)
        if: always()
        run: docker image rm orbital-electron-build orbital-android-build || true
