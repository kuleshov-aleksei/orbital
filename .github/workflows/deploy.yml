name: Deploy to Production

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      force_backup:
        description: 'Back up data even for a patch-only update'
        type: boolean
        default: false

# Never run two deploys (and their backups) on the host at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, orbital-host]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 10
          fetch-tags: true
      
      - name: Fetch tags
        run: |
          export HOME=/opt/actions-runner/_work/
          git config --global --add safe.directory /opt/actions-runner/_work/orbital/orbital
          git fetch --prune --unshallow --tags
      
      - name: Extract version
        id: get_version
        run: |
          VERSION=$(./scripts/version.sh)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Deploying version: $VERSION"
      
      - name: Validate version
        run: |
          if [ "$VERSION" = "0.0.0-unknown" ]; then
            echo "ERROR: Failed to extract version. Aborting deployment."
            exit 1
          fi
      
      - name: Build Docker images
        run: |
          # Build images with version tag using buildx (BuildKit)
          docker buildx build --build-arg VERSION=${{ env.VERSION }} --build-arg APP_URL=${{ vars.APP_URL }} -t orbital-frontend:${{ env.VERSION }} -f docker/Dockerfile.frontend .
          docker buildx build --build-arg VERSION=${{ env.VERSION }} -t orbital-backend:${{ env.VERSION }} -f docker/Dockerfile.backend .

      # Only major/minor releases may carry database migrations, so a patch-only
      # update (3.1.0 -> 3.1.1) or a redeploy skips the backup. The deployed
      # version is read from the current compose file (orbital-backend:<x.y.z-sha>);
      # if it cannot be read (first deploy), back up anyway.
      - name: Decide whether to back up
        id: backup_check
        env:
          FORCE_BACKUP: ${{ inputs.force_backup }}
        run: |
          DEPLOYED=$(sed -n 's/^ *image: orbital-backend:\([0-9][0-9.]*\)-.*/\1/p' /opt/orbital/docker-compose.yml 2>/dev/null | head -n 1 || true)
          DEPLOYED_MINOR=$(echo "$DEPLOYED" | cut -d. -f1,2)
          NEW_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          echo "Deployed: ${DEPLOYED:-unknown}, deploying: $VERSION"
          if [ "$FORCE_BACKUP" = "true" ]; then
            echo "Backup forced via workflow input"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$DEPLOYED" ]; then
            echo "Deployed version unknown, backing up"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$DEPLOYED_MINOR" = "$NEW_MINOR" ]; then
            echo "Patch-only update ($DEPLOYED_MINOR.x), skipping backup"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Minor/major update ($DEPLOYED_MINOR -> $NEW_MINOR), backing up"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # Must run before the compose file is replaced and before any container
      # is recreated: it talks to the currently deployed stack. A failure aborts
      # the deploy. See docs/notes/BACKUP_RESTORE.md.
      - name: Backup data
        if: steps.backup_check.outputs.run == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
          AWS_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          AWS_CLI_VERSION: ${{ vars.AWS_CLI_VERSION }}
        run: ./scripts/backup-release.sh "${{ env.VERSION }}"

      - name: Setup deployment directory
        run: |
          # Create deployment directory structure
          mkdir -p /opt/orbital/configs
          mkdir -p /opt/orbital/data/backend
          mkdir -p /opt/orbital/livekit
      
      - name: Copy default configs
        run: |
          # Copy default configs if they don't exist
          if [ ! -f /opt/orbital/configs/nginx.conf ]; then
            cp docker/nginx.conf /opt/orbital/configs/nginx.conf
            echo "Created default nginx.conf"
          fi
          
          # Copy LiveKit config (used by host-networked LiveKit container)
          if [ ! -f /opt/orbital/livekit/livekit.yaml ]; then
            cp livekit/livekit.yaml /opt/orbital/livekit/livekit.yaml
            echo "Created default livekit.yaml"
          fi
          
          # Create .env file if it doesn't exist
          if [ ! -f /opt/orbital/.env ]; then
            echo "LIVEKIT_API_KEY=your-api-key-change-in-production" > /opt/orbital/.env
            echo "LIVEKIT_API_SECRET=your-api-secret-change-in-production-min-32-chars" >> /opt/orbital/.env
            echo "LIVEKIT_URL=ws://localhost:7880" >> /opt/orbital/.env
            echo "Created default .env file"
          fi
      
      - name: Copy docker-compose file
        run: |
          # Copy deploy-specific compose file and substitute version
          sed "s/\${VERSION}/${{ env.VERSION }}/g" docker/docker-compose.deploy.yml > /opt/orbital/docker-compose.yml
      
      - name: Deploy
        run: |
          cd /opt/orbital
          
          # Deploy with docker compose
          docker compose up -d --remove-orphans

      # Keeps the last 3 database backup versions. Never fails a finished deploy.
      - name: Prune old backups
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
          AWS_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT }}
          AWS_CLI_VERSION: ${{ vars.AWS_CLI_VERSION }}
        run: ./scripts/prune-s3-backups.sh "${{ vars.BACKUP_S3_BUCKET }}" 3

      - name: Cleanup old Docker images
        run: |
          # Keep the current version plus the newest previous one (for rollback).
          # `docker images` lists newest first; exact match avoids 1.2.3 vs 1.2.30.
          for repo in orbital-frontend orbital-backend; do
            docker images "$repo" --format '{{.Tag}}' \
              | grep -vx "$VERSION" | tail -n +2 \
              | xargs -r -I{} docker rmi "$repo:{}" || true
          done

          # Remove dangling images (does not touch the BuildKit cache)
          docker image prune -f

          echo "Deployment completed successfully!"
          echo "Version: ${{ env.VERSION }}"

      # Keep the build cache (layers + cache mounts) for the next deploy, but cap
      # its size: least recently used records go first. Override via the
      # BUILD_CACHE_MAX repo variable.
      - name: Trim build cache
        continue-on-error: true
        run: docker buildx prune -f --max-used-space "${{ vars.BUILD_CACHE_MAX || '10gb' }}"
