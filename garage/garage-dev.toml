# DEV ONLY: Garage S3 for text channel attachments (docs/specs/CHAT_SYSTEM.md §7.12),
# used by docker-compose.dev.yml. Secrets come from .env through the compose
# environment (GARAGE_RPC_SECRET, GARAGE_DEFAULT_ACCESS_KEY/SECRET_KEY).
# Production uses an external Garage instance with its own config.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
