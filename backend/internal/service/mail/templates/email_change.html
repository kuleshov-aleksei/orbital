<!doctype html>
<html><body style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: #1f2328; line-height: 1.5;">
<p>Hi {{.Nickname}},</p>
<p>Someone asked to use this address for a {{.AppName}} account.</p>
<p><a href="{{.Link}}" style="display: inline-block; padding: 10px 18px; background: #5865f2; color: #ffffff; border-radius: 6px; text-decoration: none;">Confirm new email</a></p>
<p style="font-size: 13px; color: #59636e;">Or open this link: {{.Link}}</p>
<p style="font-size: 13px; color: #59636e;">The link is valid for {{.ExpiresIn}} and works once. Until you open it, the account keeps its current email.</p>
<p style="font-size: 13px; color: #59636e;">If you didn't ask for this, you can ignore this email.</p>
</body></html>
