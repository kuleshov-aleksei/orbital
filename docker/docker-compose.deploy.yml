services:
  frontend:
    image: orbital-frontend:${VERSION}
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - VITE_API_URL=http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - orbital-network

  backend:
    image: orbital-backend:${VERSION}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SERVER_MODE=production
      - SERVER_PORT=8080
      - RELEASES_URL=${RELEASES_URL:-https://orbital-updates.encamy.com}
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://localhost:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-dev_key}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-this_is_a_development_secret_key_32chars}
      - ROOM_MIN_USERS=2
      - ROOM_MAX_USERS=20
      - ROOM_DEFAULT_MAX_USERS=10
      # Text channels. The key comes from .env (MEILI_API_KEY, or MEILI_MASTER_KEY as a fallback).
      - MEILI_URL=${MEILI_URL:-http://meilisearch:7700}
      # Attachments use an external Garage: set CHAT_MEDIA_S3_* in .env (env_file
      # above); without them attachments are disabled (docs/specs/CHAT_SYSTEM.md §11).
      # Search by image contents reuses an existing Immich ML: set CHAT_ML_URL in
      # .env and make it reachable from this container (e.g. join Immich's network);
      # without it the feature is off (docs/specs/CHAT_SYSTEM.md §7.13).
      # Android mention pushes: put the Firebase service account key in
      # ./data/backend/fcm-service-account.json (chmod 600) and set
      # FCM_CREDENTIALS_FILE=/root/data/fcm-service-account.json in .env.
    volumes:
      - ./data/backend/:/root/data/
    depends_on:
      - livekit
      - meilisearch
    networks:
      - orbital-network

  # Text channel message store. Its volume holds PRIMARY data (messages exist
  # only here): back it up before every release, see
  # docs/specs/MEILI_RELEASE_BACKUP.md (done by scripts/backup-release.sh in the
  # deploy workflow; restore: docs/notes/BACKUP_RESTORE.md). Upgrades: snapshot + dump first, then
  # start once with MEILI_UPGRADE_DB=true (dumpless upgrades are not atomic).
  meilisearch:
    image: getmeili/meilisearch:v1.56.2
    restart: unless-stopped
    environment:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env (at least 16 bytes)}
      - MEILI_NO_ANALYTICS=true
      - MEILI_MAX_INDEXING_MEMORY=${MEILI_MAX_INDEXING_MEMORY:-1Gb}
      - MEILI_SCHEDULE_SNAPSHOT=86400
      # Keep snapshots and their staging copy on the data volume, not in /tmp.
      - MEILI_SNAPSHOT_DIR=/meili_data/snapshots
      - MEILI_DUMP_DIR=/meili_data/dumps
      - TMPDIR=/meili_data/tmp
    volumes:
      - ./data/meilisearch:/meili_data
    # Internal network only: no published port.
    networks:
      - orbital-network

  # LiveKit uses host networking for optimal WebRTC performance
  # Media traffic (UDP 62000-65535, TCP 7881, UDP 3478) goes directly to host
  # Signaling (TCP 7880) can be routed through Traefik for SSL termination
  livekit:
    image: livekit/livekit-server:v1.13.11
    container_name: orbital-livekit
    restart: unless-stopped
    command: >
      livekit-server
      --config /etc/livekit/livekit.yaml
    # Use host networking - LiveKit binds directly to host interfaces
    # This eliminates Docker networking overhead for media traffic
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7880"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  orbital-network:
    driver: bridge
